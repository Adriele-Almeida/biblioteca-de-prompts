<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Biblioteca de prompts | Adriele Almeida</title>
<style>
:root{color-scheme:dark;--lime:#c4e600;--surface:#121212;--line:#2c2c2c;--muted:#969696}*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#1c1c1c;color:inherit;border-radius:30px;padding:12px 18px;min-height:46px}button:hover{border-color:var(--lime)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.primary{background:var(--lime);color:#111;border-color:var(--lime);font-weight:650}.shell{max-width:1100px;margin:auto;padding:30px 28px 80px}.top{margin-bottom:36px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{background:var(--lime);color:#000;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:25px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.badge{font-size:12px;color:var(--lime);border:1px solid #3b420d;padding:8px 12px;border-radius:24px}.hero{padding:62px 0 30px}h1{font-size:clamp(36px,6vw,60px);letter-spacing:-2px;line-height:1.04;margin:0 0 16px;font-weight:600}h1 span{color:var(--lime)}.hero p{color:var(--muted);line-height:1.6;margin:0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 24px}.search{flex:1;min-width:200px}input,textarea,select{background:#141414;border:1px solid var(--line);color:#fff;padding:15px 17px;border-radius:18px;width:100%}textarea{min-height:300px;resize:vertical;line-height:1.6}.filters{display:flex;gap:10px;margin:0 0 26px}.filters button{font-size:14px;padding:10px 16px}.filters .active{background:#c4e61a;color:#111;border-color:#c4e61a}.count{color:var(--muted);font-size:13px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:25px;overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:12px;color:var(--lime)}.star{padding:6px 12px;background:transparent;font-size:21px;color:var(--muted)}.star.selected{color:var(--lime)}h2{font-size:24px;line-height:1.25;letter-spacing:-.5px;margin:20px 0 15px}.excerpt{color:#aaa;line-height:1.6;font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.date{font-size:12px;color:var(--muted);margin:22px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{font-size:13px;padding:10px 14px}.actions .copy{flex:1}.empty{padding:45px;color:var(--muted);border:1px dashed var(--line);border-radius:25px;text-align:center;grid-column:1/-1}dialog{width:min(760px,calc(100% - 24px));max-height:90dvh;border:1px solid #3b3b3b;border-radius:28px;background:#121212;color:#fff;padding:28px}dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:15px}.dialoghead h2{margin:0}.close{font-size:24px;padding:5px 14px}.field{display:block;margin:20px 0 8px;color:#bdbdbd;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.75 inherit;margin:25px 0}.end{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.danger{color:#ff9393}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--lime);color:#111;padding:14px 22px;border-radius:30px;display:none;z-index:10;font-size:14px;max-width:90%;text-align:center}@media(max-width:650px){.shell{padding:24px 20px 70px}.hero{padding:45px 0 26px}.grid{grid-template-columns:1fr}.badge{font-size:10px}.brand strong{font-size:14px}.tools .primary{width:100%}.card{padding:23px}h2{font-size:23px}.hero p{font-size:14px}dialog{padding:22px}.actions{gap:8px}.actions button{padding:10px 12px}}
.tools .icon-button{width:46px;min-width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}.tools .search[hidden]{display:none}.filters button{font-size:12px;padding:6px 12px;min-height:36px}@media(max-width:650px){.tools .primary{width:46px}.tools .search{min-width:0;flex:1}}
</style>
<div class="shell"><header class="top"><div class="brand"><div class="mark">▤</div><div><strong>Biblioteca de prompts</strong><small>Adriele Almeida</small></div></div></header>

<div class="tools"><button id="searchToggle" class="icon-button" aria-label="Buscar prompts" aria-expanded="false" aria-controls="search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><input id="search" class="search" type="search" placeholder="Buscar nos seus prompts..." aria-label="Buscar prompts" hidden><button class="primary icon-button" id="new" aria-label="Novo prompt"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<nav class="filters" aria-label="Filtrar prompts"><button id="all" class="active" aria-pressed="true">Todos</button><button id="favorites" aria-pressed="false">☆ Favoritos</button></nav><main id="cards" class="grid"></main></div>
<dialog id="view"><div class="dialoghead"><h2 id="viewTitle"></h2><button class="close" aria-label="Fechar visualização">×</button></div><pre id="full"></pre><div class="end"><button class="primary" id="viewCopy">Copiar prompt completo</button></div></dialog>
<dialog id="editor"><form id="form"><div class="dialoghead"><h2 id="editTitle">Novo prompt</h2><button type="button" class="close" aria-label="Fechar editor">×</button></div><label class="field" for="title">Título</label><input id="title" required maxlength="200"><label class="field" for="category">Categoria</label><input id="category" required maxlength="100" value="Geral"><label class="field" for="content">Prompt completo</label><textarea id="content" required placeholder="Cole seu prompt aqui..."></textarea><div class="end"><button type="button" id="cancel">Cancelar</button><button class="primary" id="save">Salvar prompt</button></div></form></dialog>
<dialog id="remove"><h2>Excluir este prompt?</h2><div class="end"><button id="keep">Cancelar</button><button id="confirmRemove" class="danger">Excluir</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const seed=[{"id":"genui","title":"Gerar interface nativa interativa no ChatGPT","category":"Interfaces interativas","content":"INSTRUÇÃO: GERAR INTERFACE NATIVA INTERATIVA NO CHATGPT\n\nUtilize os recursos internos de geração de interfaces interativas do ChatGPT, conhecidos como GenUI / DIL (Dynamic Interface Language), caso estejam disponíveis neste ambiente.\n\nOBJETIVO\n\nTransformar os arquivos localizados em um formulário visual, funcional e interativo, renderizado diretamente nesta conversa.\n\nREFERÊNCIA VISUAL\n\nSiga o estilo dos prints enviados:\n\n* Fundo preto ou escuro.\n* Cards com cantos arredondados.\n* Destaques em verde-limão.\n* Botões modernos e arredondados.\n* Organização vertical, adequada ao iPhone.\n\nESTRUTURA DO FORMULÁRIO\n\nPara cada arquivo localizado, apresente um card contendo:\n\n1. Nome completo do arquivo.\n2. Data original.\n3. Duas opções selecionáveis:\n    * Salvar na biblioteca.\n    * Não precisa.\n\nCada arquivo deve permitir uma escolha independente.\n\nAo final, inclua um botão funcional “Confirmar seleção”, que envie as escolhas para processamento na conversa. O salvamento efetivo deverá ocorrer após a confirmação e mediante as ferramentas disponíveis.\n\nREQUISITOS TÉCNICOS\n\nUtilize componentes nativos de interface e gerenciamento de estado reativo, quando disponíveis.\n\nOs botões e opções precisam ser realmente clicáveis, com indicação visual da seleção.\n\nRenderize o formulário diretamente na resposta do ChatGPT.\n\nCRITÉRIO DE EXECUÇÃO\n\nExecute agora a apresentação dos três arquivos de automações já identificados anteriormente.\n\nEntregue a interface funcional na resposta atual, em vez de descrever como ela seria.\n\nCaso os recursos GenUI/DIL estejam indisponíveis nesta sessão, informe essa limitação com precisão. Não substitua a interface por botões simulados com textos entre colchetes","favorite":false,"created_at":"2026-10-21T00:00:00-03:00"}];
const $=id=>document.getElementById(id);let prompts=seed,onlyFavorites=false,editing=null,viewing=null,removing=null,timer;try{const saved=JSON.parse(localStorage.getItem('adriele-prompts-template-v1'));if(Array.isArray(saved))prompts=saved}catch{}
function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3000)}
function persist(){try{localStorage.setItem('adriele-prompts-template-v1',JSON.stringify(prompts));return true}catch{notify('Armazenamento indisponível. Alterações mantidas nesta sessão.');return false}}
function btn(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
async function copy(p){try{await navigator.clipboard.writeText(p.content);notify('Prompt completo copiado')}catch{view(p);notify('Selecione o texto completo para copiar')}}
function view(p){viewing=p;$('viewTitle').textContent=p.title;$('full').textContent=p.content;if(!$('view').open)$('view').showModal()}
function edit(p){editing=p?.id||null;$('editTitle').textContent=p?'Editar prompt':'Novo prompt';$('title').value=p?.title||'';$('category').value=p?.category||'Geral';$('content').value=p?.content||'';$('editor').showModal()}
function render(){let q=$('search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let filtered=prompts.filter(p=>(!onlyFavorites||p.favorite)&&[p.title,p.content,p.category].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('cards').replaceChildren();for(const p of filtered){let card=document.createElement('article');card.className='card';let head=document.createElement('div');head.className='cardhead';let tag=document.createElement('span');tag.className='tag';tag.textContent=p.category;head.append(tag);let star=btn(p.favorite?'★':'☆',()=>{p.favorite=!p.favorite;persist();render()},'star'+(p.favorite?' selected':''));star.setAttribute('aria-label',p.favorite?'Remover dos favoritos':'Adicionar aos favoritos');star.setAttribute('aria-pressed',String(p.favorite));head.append(star);let title=document.createElement('h2');title.textContent=p.title;let excerpt=document.createElement('p');excerpt.className='excerpt';excerpt.textContent=p.content;let date=document.createElement('p');date.className='date';date.textContent='Criado em '+new Date(p.created_at).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});let actions=document.createElement('div');actions.className='actions';actions.append(btn('Copiar prompt',()=>copy(p),'primary copy'),btn('Visualizar',()=>view(p)),btn('Editar',()=>edit(p)),btn('Excluir',()=>{removing=p.id;$('remove').showModal()}));card.append(head,title,excerpt,date,actions);$('cards').append(card)}if(!filtered.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='Nenhum prompt encontrado.';$('cards').append(empty)}}
$('searchToggle').onclick=()=>{const open=$('search').hidden;$('search').hidden=!open;$('searchToggle').setAttribute('aria-expanded',String(open));if(open)$('search').focus()};$('new').onclick=()=>edit();$('search').oninput=render;$('all').onclick=()=>{onlyFavorites=false;filters()};$('favorites').onclick=()=>{onlyFavorites=true;filters()};function filters(){for(const [id,active] of [['all',!onlyFavorites],['favorites',onlyFavorites]]){$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active))}render()}
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('cancel').onclick=()=>$('editor').close();$('keep').onclick=()=>$('remove').close();$('viewCopy').onclick=()=>copy(viewing);
$('form').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim(),content=$('content').value.trim(),category=$('category').value.trim();if(!title||!content||!category){notify('Preencha título, categoria e prompt.');return}let p={title,content,category};if(editing){Object.assign(prompts.find(p=>p.id===editing),p)}else{prompts.unshift({...p,id:crypto.randomUUID(),favorite:false,created_at:new Date().toISOString()})}let saved=persist();render();$('editor').close();if(saved)notify('Salvo neste dispositivo')};
$('confirmRemove').onclick=()=>{prompts=prompts.filter(p=>p.id!==removing);persist();render();$('remove').close();notify('Prompt excluído')};render();
</script></html>
